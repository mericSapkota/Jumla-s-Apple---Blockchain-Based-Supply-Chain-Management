spring.application.name=scm

# Server
server.port=8080

# Values below are sourced from backend/aenv via spring-dotenv.
# See aenv.example for the template. Non-secret framework constants stay inline.

app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}

#PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA ?????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ?? JWT ?????????????????????????????????????????????
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

## ?? Web3j / Blockchain ??????????????????????????????
web3j.client-address=${WEB3J_CLIENT_ADDRESS}
web3j.contract-address=${WEB3J_CONTRACT_ADDRESS}
web3j.deployer-private-key=${WEB3J_DEPLOYER_PRIVATE_KEY}

# ?? CORS ?????????????????????????????????????????????
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Profile picture / file upload
# Absolute path to the Vite frontend's `public` directory so uploaded profile
# pictures are served by Vite.
app.upload.frontend-public-dir=${UPLOAD_FRONTEND_PUBLIC_DIR}

# URL prefix used to reference the picture from the browser (no host , Vite serves it)
app.upload.url-prefix=/uploads/profiles

# Max multipart upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ?? Mail / Email Verification ??????????????????????????????
# Gmail requires an App Password (not your regular password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.verification.token-expiry-hours=24

# ?? eSewa ePay v2 (donations) ??????????????????????????????
esewa.form-url=${ESEWA_FORM_URL}
esewa.product-code=${ESEWA_PRODUCT_CODE}
esewa.secret-key=${ESEWA_SECRET_KEY}

# Donation recipient details
app.donation.recipient-name=${DONATION_RECIPIENT_NAME}
app.donation.recipient-phone=${DONATION_RECIPIENT_PHONE}

# ?? Superadmin seed account ??????????????????????????????
# Created at startup if missing (see AdminSeeder).
app.admin.email=${ADMIN_EMAIL:admin@jumla.org}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@123}

# ?? Google OAuth (Continue with Google) ??????????????????????
google.client-id=${GOOGLE_CLIENT_ID:}
