# Profile picture / file upload
# Absolute path to the Vite frontend's `public` directory so uploaded profile

app.upload.frontend-public-dir=/Users/mericsapkota/mess/intern/Jumla's Apple B-SCM/frontend/public

# URL prefix used to reference the picture from the browser (no host , Vite serves it)
app.upload.url-prefix=/uploads/profiles

# Max multipart upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ?? Mail / Email Verification ??????????????????????????????
# Gmail requires an App Password (not your regular password) - generate one at
# Google Account -> Security -> 2-Step Verification -> App Passwords, then set
# these as environment variables before starting the backend.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.verification.token-expiry-hours=24

