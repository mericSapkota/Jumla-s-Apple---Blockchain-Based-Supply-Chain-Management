spring.application.name=scm

# Server
server.port=8080

# Values below are sourced from backend/aenv via spring-dotenv.
# See aenv.example for the template. Non-secret framework constants stay inline.

app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}

#PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA ?????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ?? JWT ?????????????????????????????????????????????
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

## ?? Web3j / Blockchain ??????????????????????????????
web3j.client-address=${WEB3J_CLIENT_ADDRESS}
web3j.contract-address=${WEB3J_CONTRACT_ADDRESS}
web3j.deployer-private-key=${WEB3J_DEPLOYER_PRIVATE_KEY}
# Chain id the backend signs with (EIP-155). Sepolia=11155111, Ganache=1337,
# Hardhat=31337. MUST match the network WEB3J_CLIENT_ADDRESS points at.
web3j.chain-id=${WEB3J_CHAIN_ID:11155111}
# Static gas for backend-signed writes (assignRole). Testnet gas is free, so
# keep the price well above Sepolia's floating base fee to avoid stuck txns.
web3j.gas-price-wei=${WEB3J_GAS_PRICE_WEI:30000000000}
web3j.gas-limit=${WEB3J_GAS_LIMIT:1500000}

# ?? CORS ?????????????????????????????????????????????
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Profile picture / file upload
# Absolute path to the Vite frontend's `public` directory so uploaded profile
# pictures are served by Vite.
app.upload.frontend-public-dir=${UPLOAD_FRONTEND_PUBLIC_DIR}

# URL prefix used to reference the picture from the browser (no host , Vite serves it)
app.upload.url-prefix=/uploads/profiles

# URL prefix for uploaded blog cover images (also served by Vite from /public)
app.upload.blog-url-prefix=/uploads/blogs

# Max multipart upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ?? Mail / Email Verification ??????????????????????????????
# Defaults target the local Mailpit container (see docker-compose.yml) —
# no auth, no TLS, nothing leaves your machine. Override MAIL_* in .env to
# point at a real SMTP provider (Gmail, SES, Postmark, ...) for production.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.verification.token-expiry-hours=24

# ?? eSewa ePay v2 (donations) ??????????????????????????????
esewa.form-url=${ESEWA_FORM_URL}
esewa.product-code=${ESEWA_PRODUCT_CODE}
esewa.secret-key=${ESEWA_SECRET_KEY}

# Donation recipient details
app.donation.recipient-name=${DONATION_RECIPIENT_NAME}
app.donation.recipient-phone=${DONATION_RECIPIENT_PHONE}

# ?? Superadmin seed account ??????????????????????????????
# Created at startup if missing (see AdminSeeder).
app.admin.email=${ADMIN_EMAIL:admin@jumla.org}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@123}

# ?? Google OAuth (Continue with Google) ??????????????????????
google.client-id=${GOOGLE_CLIENT_ID:}

# ?? AI chat assistant (Anthropic Claude) ??????????????????????
# Leave ANTHROPIC_API_KEY blank to keep the chat widget running with a friendly
# fallback reply instead of live AI answers.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:1024}
